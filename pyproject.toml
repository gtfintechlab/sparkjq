[project]
name = "sparkjq"
version = "0.1.0"
description = "A sample project for Spark job queue management"
authors = [
    { name="Rodrigo Loza", email="roloza7@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyspark",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.21",
    "responses>=0.23",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    "bandit[toml]>=1.7.5",
]

[tool.setuptools]
packages = ["sparkjq"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["sparkjq"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "I",     # isort
    "C90",   # mccabe complexity
    "N",     # pep8-naming
    "D",     # pydocstyle
    "RUF",   # ruff-specific rules
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D103",  # Missing docstring in public function
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D200",  # One-line docstring should fit on one line
    "D205",  # 1 blank line required between summary line and description
    "E501",  # Line too long
    "RUF013", # PEP 484 prohibits implicit Optional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["sparkjq"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B404", "B603"]  # assert_used, import_subprocess, subprocess_without_shell - valid for SLURM integration

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
